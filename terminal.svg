<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>

    <clipPath id="c1"><rect x="54" y="72" height="26" width="0"><animate attributeName="width" from="0" to="80" begin="0.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="54" y="134" height="26" width="0"><animate attributeName="width" from="0" to="310" begin="1.6s" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="54" y="300" height="26" width="0"><animate attributeName="width" from="0" to="210" begin="3.8s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="54" y="414" height="26" width="0"><animate attributeName="width" from="0" to="240" begin="5.5s" dur="0.9s" fill="freeze"/></rect></clipPath>

    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 16px; }
      .p { fill: #a78bfa; font-weight: 700; }
      .cmd { fill: #22d3ee; font-weight: 600; }
      .out { fill: #e4e4e7; }
      .dim { fill: #71717a; }
      .ok { fill: #4ade80; }
      .hl { fill: #f0abfc; }
      .o { opacity: 0; animation: show 0.25s ease-out forwards; }
      @keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      .cursor { opacity: 0; animation: blink 1s step-end 6.5s infinite; }
      @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- window -->
  <rect x="10" y="10" width="840" height="460" rx="14" fill="#09090b" stroke="url(#border)" stroke-width="2" filter="url(#glow)" class="pulse"/>
  <rect x="10" y="10" width="840" height="460" rx="14" fill="#09090b"/>
  <rect x="10" y="10" width="840" height="40" rx="14" fill="#18181b"/>
  <rect x="10" y="36" width="840" height="14" fill="#18181b"/>
  <circle cx="36" cy="30" r="6" fill="#f87171"/>
  <circle cx="56" cy="30" r="6" fill="#facc15"/>
  <circle cx="76" cy="30" r="6" fill="#4ade80"/>
  <text x="430" y="35" text-anchor="middle" class="dim" style="font-size:13px">raihan@platform: ~</text>

  <g filter="url(#textglow)">
    <!-- 1 -->
    <text x="32" y="90" class="p">$</text>
    <text x="56" y="90" class="cmd" clip-path="url(#c1)">whoami</text>
    <text x="32" y="116" class="out o" style="animation-delay:1.1s">Raihan Islam <tspan class="dim">//</tspan> DevOps Engineer <tspan class="dim">//</tspan> Platform Engineer</text>

    <!-- 2 -->
    <text x="32" y="152" class="p">$</text>
    <text x="56" y="152" class="cmd" clip-path="url(#c2)">kubectl get skills -n platform</text>
    <g class="o" style="animation-delay:2.8s"><text x="32" y="178" class="dim">NAME</text><text x="252" y="178" class="dim">STATUS</text><text x="372" y="178" class="dim">STACK</text></g>
    <g class="o" style="animation-delay:3.0s"><text x="32" y="204" class="out">orchestration</text><text x="252" y="204" class="ok">Running</text><text x="372" y="204" class="out">Kubernetes · Docker · GitOps</text></g>
    <g class="o" style="animation-delay:3.15s"><text x="32" y="230" class="out">delivery</text><text x="252" y="230" class="ok">Running</text><text x="372" y="230" class="out">CI/CD · Terraform · Ansible</text></g>
    <g class="o" style="animation-delay:3.3s"><text x="32" y="256" class="out">observability</text><text x="252" y="256" class="ok">Running</text><text x="372" y="256" class="out">Prometheus · Grafana · OTel</text></g>
    <g class="o" style="animation-delay:3.45s"><text x="32" y="282" class="out">engineering</text><text x="252" y="282" class="ok">Running</text><text x="372" y="282" class="out">Python · Go · FastAPI</text></g>

    <!-- 3 -->
    <text x="32" y="318" class="p">$</text>
    <text x="56" y="318" class="cmd" clip-path="url(#c3)">cat achievements.log</text>
    <text x="32" y="344" class="out o" style="animation-delay:4.8s"><tspan class="ok">[✓]</tspan> <tspan class="hl">AI Hackathon Champion</tspan> — Vivasoft, 2025</text>
    <text x="32" y="370" class="out o" style="animation-delay:4.95s"><tspan class="ok">[✓]</tspan> BSc in Mechatronics Engineering</text>
    <text x="32" y="396" class="out o" style="animation-delay:5.1s"><tspan class="ok">[✓]</tspan> PLC · SCADA · HMI industrial training @ BITAC</text>

    <!-- 4 -->
    <text x="32" y="432" class="p">$</text>
    <text x="56" y="432" class="cmd" clip-path="url(#c4)">./automate --everything</text>
    <rect x="284" y="418" width="10" height="18" fill="#22d3ee" class="cursor"/>
  </g>

  <!-- CRT scanlines -->
  <rect x="10" y="10" width="840" height="460" rx="14" fill="url(#scan)" pointer-events="none"/>
</svg>
